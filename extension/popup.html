<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        font:
          13px system-ui,
          sans-serif;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }
      input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 6px;
        font: inherit;
        font-weight: normal;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      button {
        flex: 1;
        padding: 8px;
        font: inherit;
        cursor: pointer;
      }
      #sync {
        background: #5b2d90;
        color: #fff;
        border: none;
        border-radius: 4px;
      }
      #status {
        margin-top: 10px;
        white-space: pre-wrap;
        color: #444;
      }
      #status.error {
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <label>
      Source site
      <input id="source" placeholder="https://app.example.com" />
    </label>
    <label>
      Target
      <input id="target" placeholder="http://localhost:5173" />
    </label>
    <div class="row">
      <button id="sync">Copy to target</button>
      <button id="script" title="Copy document.cookie = ... lines to paste into a DevTools console">
        Copy as script
      </button>
    </div>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
